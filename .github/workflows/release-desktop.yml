name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build sidecar (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          chmod +x scripts/build_sidecar.sh scripts/build_desktop.sh
          ./scripts/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m venv python/.venv
          python/.venv/Scripts/python.exe -m pip install -U pip
          python/.venv/Scripts/python.exe -m pip install -r python/requirements.txt pyinstaller
          Set-Location python
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --onefile --name mailrag-sidecar `
            --hidden-import keyring.backends --hidden-import keyring.backends.Windows `
            --hidden-import google.genai sidecar.py
          New-Item -ItemType Directory -Force -Path ..\desktop\src-tauri\binaries | Out-Null
          Copy-Item dist\mailrag-sidecar.exe ..\desktop\src-tauri\binaries\mailrag-sidecar-x86_64-pc-windows-msvc.exe
          Copy-Item dist\mailrag-sidecar.exe ..\desktop\src-tauri\binaries\mailrag-sidecar.exe

      - name: Install Linux deps (noop placeholder)
        if: false
        run: echo skip

      - name: Tauri build
        working-directory: desktop
        run: npm run tauri -- build

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: picot-airu-ai-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: picot-airu-ai-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
